
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Punkt rosy">
<title>Kalkulator punktu rosy</title>
<style>
:root {
  --bg: #0b1120;
  --card: rgba(30, 41, 59, 0.6);
  --border: rgba(148, 163, 184, 0.12);
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --accent: #22d3ee;
  --accent-bg: rgba(34, 211, 238, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 20px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  background-image:
    radial-gradient(ellipse at 50% -20%, rgba(34, 211, 238, 0.12), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(168, 85, 247, 0.08), transparent 60%);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* === Nagłówek === */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px;
}

.title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.title svg { color: var(--accent); }

.units {
  display: flex;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}

.units button {
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  background: transparent;
  border: 0;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}

.units button.active {
  background: var(--accent);
  color: #0b1120;
}

/* === Karty === */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 22px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

/* === Karta wyniku === */
.result-card {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 26px 22px 22px;
  background: linear-gradient(180deg, var(--accent-bg) 0%, rgba(30, 41, 59, 0.6) 70%);
  transition: background 0.4s ease;
}

.result-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.result-value {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 2px;
  color: var(--accent);
  transition: color 0.4s ease;
  line-height: 1;
}

#dpNumber {
  font-size: 68px;
  font-weight: 200;
  letter-spacing: -3px;
  font-variant-numeric: tabular-nums;
}

.result-unit {
  font-size: 26px;
  font-weight: 300;
  opacity: 0.75;
}

.comfort-badge {
  display: inline-block;
  margin-top: 16px;
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3px;
  background: var(--accent-bg);
  color: var(--accent);
  transition: background 0.4s, color 0.4s;
}

/* === Skala komfortu === */
.scale {
  margin-top: 22px;
  position: relative;
  height: 14px;
}

.scale-bar {
  position: absolute;
  top: 4px;
  left: 0;
  right: 0;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg,
    #7dd3fc 0%,
    #67e8f9 25%,
    #86efac 50%,
    #fde047 65%,
    #fdba74 80%,
    #fb923c 90%,
    #f87171 100%);
  opacity: 0.9;
}

.scale-marker {
  position: absolute;
  top: 0;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--bg);
  transform: translateX(-50%);
  transition: left 0.12s ease-out;
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
  z-index: 1;
}

.scale-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  font-weight: 600;
  color: #64748b;
  margin-top: 2px;
  letter-spacing: 0.3px;
}

.detail {
  margin-top: 14px;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 500;
  line-height: 1.4;
}

/* === Kontrolki === */
.control + .control { margin-top: 22px; }

.control-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}

.control-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
}

.control-value {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}

/* === Suwaki === */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.9);
  outline: none;
  cursor: pointer;
  border: 0;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #22d3ee, #0ea5e9);
  border: 3px solid var(--bg);
  box-shadow: 0 2px 12px rgba(34, 211, 238, 0.4);
  cursor: pointer;
  transition: transform 0.15s ease;
}

input[type="range"]::-webkit-slider-thumb:active {
  transform: scale(1.15);
}

input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, #22d3ee, #0ea5e9);
  border: 3px solid var(--bg);
  box-shadow: 0 2px 12px rgba(34, 211, 238, 0.4);
  cursor: pointer;
}

input[type="range"]::-moz-range-track {
  height: 8px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.9);
}

input[type="range"]::-moz-range-progress {
  height: 8px;
  border-radius: 999px;
  background: #22d3ee;
}

/* === Stopka === */
.footer {
  text-align: center;
  font-size: 11px;
  color: #475569;
  padding: 0 20px;
  line-height: 1.5;
}

/* === Małe ekrany === */
@media (max-height: 660px) {
  #dpNumber { font-size: 56px; }
  .result-card { padding: 20px 18px 18px; }
  .comfort-badge { margin-top: 12px; }
  .scale { margin-top: 16px; }
  .card { padding: 18px; }
  .control + .control { margin-top: 18px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z"/>
      </svg>
      Punkt rosy
    </div>
    <div class="units" role="group" aria-label="Jednostka temperatury">
      <button data-unit="C" class="active" aria-pressed="true">°C</button>
      <button data-unit="F" aria-pressed="false">°F</button>
    </div>
  </div>

  <div class="card result-card" id="resultCard">
    <div class="result-label">Punkt rosy</div>
    <div class="result-value">
      <span id="dpNumber">--</span><span class="result-unit" id="dpUnit">°C</span>
    </div>
    <div class="comfort-badge" id="comfort">—</div>

    <div class="scale">
      <div class="scale-bar"></div>
      <div class="scale-marker" id="marker" style="left:50%"></div>
    </div>
    <div class="scale-labels">
      <span id="scaleMin">−10°</span>
      <span id="scaleMid">10°</span>
      <span id="scaleMax">30°</span>
    </div>

    <div class="detail" id="detail">—</div>
  </div>

  <div class="card">
    <div class="control">
      <div class="control-head">
        <label class="control-label" for="temp">Temperatura</label>
        <span class="control-value" id="tempVal">22.0°C</span>
      </div>
      <input type="range" id="temp" min="-50" max="60" step="0.5" value="22">
    </div>

    <div class="control">
      <div class="control-head">
        <label class="control-label" for="humidity">Wilgotność</label>
        <span class="control-value" id="humidityVal">55%</span>
      </div>
      <input type="range" id="humidity" min="1" max="100" step="1" value="55">
    </div>
  </div>

  <div class="footer">Obliczenia według wzoru Magnusa–Tetensa</div>
</div>

<script>
(() => {
  'use strict';

  /* Stałe wzoru Magnusa (Arden Buck) */
  const A = 17.271;
  const B = 237.7;

  /* Zakres skali komfortu w °C */
  const SCALE_MIN = -10;
  const SCALE_MAX = 30;

  const state = {
    tempC: 22,
    humidity: 55,
    unit: 'C'
  };

  const els = {
    temp: document.getElementById('temp'),
    humidity: document.getElementById('humidity'),
    tempVal: document.getElementById('tempVal'),
    humidityVal: document.getElementById('humidityVal'),
    dpNumber: document.getElementById('dpNumber'),
    dpUnit: document.getElementById('dpUnit'),
    comfort: document.getElementById('comfort'),
    marker: document.getElementById('marker'),
    detail: document.getElementById('detail'),
    resultCard: document.getElementById('resultCard'),
    scaleMin: document.getElementById('scaleMin'),
    scaleMid: document.getElementById('scaleMid'),
    scaleMax: document.getElementById('scaleMax'),
    unitButtons: Array.from(document.querySelectorAll('.units button'))
  };

  /* Progi komfortu według punktu rosy (w °C) */
  const comfortLevels = [
    { max: 5,        label: 'Bardzo sucho',   color: '#7dd3fc' },
    { max: 10,       label: 'Sucho',          color: '#67e8f9' },
    { max: 16,       label: 'Komfortowo',     color: '#86efac' },
    { max: 20,       label: 'Lekko wilgotno', color: '#fde047' },
    { max: 24,       label: 'Wilgotno',       color: '#fdba74' },
    { max: Infinity, label: 'Duszno',         color: '#f87171' }
  ];

  const cToF = c => c * 9 / 5 + 32;

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  /* Wzór Magnusa–Tetensa: Td = (b·α)/(a−α) */
  function dewPoint(T, RH) {
    const rh = Math.max(0.1, Math.min(100, RH));
    const alpha = Math.log(rh / 100) + (A * T) / (B + T);
    return (B * alpha) / (A - alpha);
  }

  function formatTemp(c, withUnit = true) {
    if (state.unit === 'C') {
      return withUnit ? c.toFixed(1) + '°C' : c.toFixed(1);
    }
    const f = cToF(c);
    return withUnit ? f.toFixed(1) + '°F' : f.toFixed(1);
  }

  function getComfort(dp) {
    return comfortLevels.find(l => dp < l.max) || comfortLevels[comfortLevels.length - 1];
  }

  /* Wypełnienie suwaka kolorem */
  function updateRangeFill(el) {
    const min = parseFloat(el.min);
    const max = parseFloat(el.max);
    const val = parseFloat(el.value);
    const pct = ((val - min) / (max - min)) * 100;
    el.style.background =
      `linear-gradient(90deg, #22d3ee 0%, #22d3ee ${pct}%, rgba(15, 23, 42, 0.9) ${pct}%, rgba(15, 23, 42, 0.9) 100%)`;
  }

  function updateTempUI() {
    els.tempVal.textContent = formatTemp(state.tempC, true);
    updateRangeFill(els.temp);
  }

  function updateHumidityUI() {
    els.humidityVal.textContent = state.humidity + '%';
    updateRangeFill(els.humidity);
  }

  function updateScaleLabels() {
    if (state.unit === 'C') {
      els.scaleMin.textContent = SCALE_MIN + '°';
      els.scaleMid.textContent = '10°';
      els.scaleMax.textContent = SCALE_MAX + '°';
    } else {
      els.scaleMin.textContent = Math.round(cToF(SCALE_MIN)) + '°';
      els.scaleMid.textContent = Math.round(cToF(10)) + '°';
      els.scaleMax.textContent = Math.round(cToF(SCALE_MAX)) + '°';
    }
  }

  function update() {
    const dp = dewPoint(state.tempC, state.humidity);

    /* Wynik */
    els.dpNumber.textContent = formatTemp(dp, false);
    els.dpUnit.textContent = state.unit === 'C' ? '°C' : '°F';

    /* Poziom komfortu + kolor */
    const comfort = getComfort(dp);
    els.comfort.textContent = comfort.label;

    els.resultCard.style.setProperty('--accent', comfort.color);
    els.resultCard.style.setProperty('--accent-bg', hexToRgba(comfort.color, 0.12));

    /* Znacznik na skali */
    const clamped = Math.max(SCALE_MIN, Math.min(SCALE_MAX, dp));
    const pct = ((clamped - SCALE_MIN) / (SCALE_MAX - SCALE_MIN)) * 100;
    els.marker.style.left = pct + '%';

    /* Informacja o odległości od kondensacji */
    const diff = state.tempC - dp;
    if (diff < 0.5) {
      els.detail.textContent = 'Kondensacja zachodzi praktycznie natychmiast';
    } else if (diff < 2) {
      els.detail.textContent = 'Do kondensacji: ' + formatTemp(diff, true) + ' — rosa/mgła bardzo prawdopodobna';
    } else {
      els.detail.textContent = 'Do kondensacji: ' + formatTemp(diff, true);
    }
  }

  function setUnit(unit) {
    if (unit !== 'C' && unit !== 'F') return;
    state.unit = unit;

    els.unitButtons.forEach(btn => {
      const isActive = btn.dataset.unit === unit;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-pressed', String(isActive));
    });

    try { localStorage.setItem('dewpoint_unit', unit); } catch (e) {}

    updateTempUI();
    updateScaleLabels();
    update();
  }

  /* === Zdarzenia === */
  els.temp.addEventListener('input', e => {
    state.tempC = parseFloat(e.target.value);
    updateTempUI();
    update();
  });

  els.humidity.addEventListener('input', e => {
    state.humidity = parseInt(e.target.value, 10);
    updateHumidityUI();
    update();
  });

  els.unitButtons.forEach(btn => {
    btn.addEventListener('click', () => setUnit(btn.dataset.unit));
  });

  /* === Start === */
  function init() {
    state.tempC = parseFloat(els.temp.value);
    state.humidity = parseInt(els.humidity.value, 10);

    let saved = 'C';
    try { saved = localStorage.getItem('dewpoint_unit') || 'C'; } catch (e) {}

    updateTempUI();
    updateHumidityUI();
    setUnit(saved);
  }

  init();
})();
</script>
</body>
</html>
